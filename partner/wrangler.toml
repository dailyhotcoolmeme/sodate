name = "sodate-partner"
compatibility_date = "2026-01-01"
pages_build_output_dir = "dist"

# admin과 같은 R2 버킷을 공유한다 — 공개 서빙은 이미 admin/functions/media/[[path]].ts
# 가 인증 없이 하고 있어(공개 읽기), 여기서 새로 만들 필요가 없다. 업로드만 이 쪽에서
# partner/{company_id}/ 폴더 밑에 넣고, 완성 URL은 sodate-admin.pages.dev/media/... 로 만든다.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sodate-media"
