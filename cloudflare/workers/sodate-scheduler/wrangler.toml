name = "sodate-scheduler"
main = "src/index.ts"
compatibility_date = "2026-07-25"
account_id = "4c0f5d706177b84ade4d424a08ec46e8"

# 이 Worker가 정기 실행의 단일 정본으로 GitHub API(workflow_dispatch)를 호출한다.
# GitHub schedule은 지연·드롭 사고가 있었고, 동시에 켜 두면 concurrency가 중복 제거가
# 아니라 순차 실행을 해 전체 크롤과 Apify 비용이 두 배가 됐다(2026-09-29 확인).
# 누락 시에는 별도 watchdog이 마지막 성공 시각을 보고 한 번만 자가복구한다.
#
# 환경 변수는 secret으로 설정(절대 여기 값 입력 금지):
#   wrangler secret put GH_PAT
#   (GitHub Fine-grained PAT, dailyhotcoolmeme/sodate repo 전용, Actions: Read and write)

[triggers]
crons = ["*/10 * * * *", "*/20 * * * *", "2,17,32,47 * * * *", "0 23 * * *", "0 11 * * *"]
