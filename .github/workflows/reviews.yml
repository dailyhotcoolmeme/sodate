name: Crawl Reviews

# ⚠️(2026-07-25) 원래 crawl.yml 안의 한 스텝이었는데, "workflow_dispatch면 매번 실행"
# 조건이 CF Worker/워치독의 반복 재시도(전부 workflow_dispatch)마다 이 느린 후기수집
# 스텝을 계속 다시 돌게 만들어 30분 타임아웃 무한 재발 사고를 일으켰음. 후기는 비핵심
# (장식용) 정보라 가격·나이 등 핵심 크롤(crawl.yml)의 타임아웃 예산을 갉아먹으면 안
# 됨 — 완전히 분리된 워크플로로 뺐다. 여기가 타임아웃 나도 crawl.yml엔 영향 없음.
on:
  schedule:
    # 주 1회 — 월요일 08:00 KST(오너 확정 2026-07-31: "크게 중요하지 않다").
    # 후기는 한 번 모이면 잘 안 바뀌고, 게시일을 정확히 받으려고 글마다 한 번씩 더
    # 열게 되면서 느려졌다. 매일 돌릴 이유가 없다.
    - cron: '0 23 * * 0'
  workflow_dispatch:

concurrency:
  group: reviews
  cancel-in-progress: false

jobs:
  reviews:
    runs-on: ubuntu-22.04
    # 게시일을 글마다 따로 조회하게 되면서 느려졌다(유튜브 영상별 1회 + 재시도,
    # 블로그는 검색 결과에서 날짜를 못 읽은 건만 본문 조회). 주 1회라 여유를 넉넉히.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('crawler/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('crawler/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          cd crawler
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run review crawlers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd crawler
          python reviews_main.py
