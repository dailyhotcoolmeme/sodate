name: Price Accuracy Recheck
on:
  workflow_dispatch:
    inputs:
      vendor:
        description: '검증 범위'
        type: choice
        default: all
        options: [all, modparty]
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r crawler/requirements.txt
      - run: playwright install --with-deps chromium
      - name: Read-only nonimweb price comparison through scheduled QA function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODPARTY_ID: ${{ secrets.MODPARTY_ID }}
          MODPARTY_PW: ${{ secrets.MODPARTY_PW }}
          PRICE_CHECK_VENDOR: ${{ inputs.vendor }}
        run: |
          cd crawler
          python -u - <<'PY'
          import os
          import price_accuracy_check as qa
          if os.environ.get('PRICE_CHECK_VENDOR') == 'modparty':
              vendors = qa._nonimweb_scrapers()
              qa._nonimweb_scrapers = lambda: {'modparty': vendors['modparty']}
          issues = qa.check_nonimweb_live(qa.get_supabase())
          for issue in issues:
              print(issue, flush=True)
          print('PRICE_RECHECK_COMPLETE', flush=True)
          raise SystemExit(1 if issues else 0)
          PY
