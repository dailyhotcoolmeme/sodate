name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-data-api-grants:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: grants-test-only
          POSTGRES_DB: grants_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check explicit grants and simulate the new Supabase defaults
        env:
          GRANTS_TEST_DB_URL: postgresql://postgres:grants-test-only@localhost:5432/grants_test
        run: python3 -m unittest discover -s supabase -p 'test_data_api_grants.py' -v

  test-crawler:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd crawler
          pip install -r requirements.txt
          playwright install chromium
      - name: Run tests
        run: |
          cd crawler
          pytest tests/ -v

  test-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd app
          npm ci
      - name: Type check
        run: |
          cd app
          npx tsc --noEmit
