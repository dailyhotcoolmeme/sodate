name: Crawl Sodate Events

on:
  schedule:
    - cron: '0 23 * * *'   # 매일 오전 08:00 KST (UTC 23:00 전날)
    - cron: '0 11 * * *'   # 매일 오후 20:00 KST (UTC 11:00)
  workflow_dispatch:         # 수동 실행 / CF Worker 백업트리거 / 워치독 자가복구
    inputs:
      slot:
        description: "정기 슬롯 재현용(evening=20시 마감알림 포함). 비우면 마감알림 스킵(워치독 임시 재시도용)"
        required: false

# GH 자체 schedule이 원인불명으로 몇시간씩 안 도는 사고(2026-07-25, refresh-soldout/watchdog에서
# 확인) 대응으로 Cloudflare Worker(sodate-scheduler)가 같은 시각에 workflow_dispatch로도 깨움 —
# 둘 다 겹쳐 발화해도 여기서 큐잉만 되고 동시 실행은 안 되게 방지.
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-22.04
    # ⚠️(2026-07-25) 후기수집 분리 후에도 실측 29분46초로 30분 한도를 간신히 통과 —
    # 여유 없이 안전마진 0에 가까워 조금만 느려져도 다시 타임아웃 재발. 45분으로 확대.
    #
    # ⚠️(2026-09-04) 그 45분마저 못 지켰다. 업체가 17곳으로 늘고 문토(모임 1,400여개,
    #    실측 34분)·프립(810건, 10분)이 앞에서 시간을 다 써버려 **뒤 순서 13곳은 차례가
    #    오기 전에 잘렸다.** 최근 200회 실행이 전부 타임아웃 취소였고 성공이 한 번도 없다.
    #    로꼬가 8/31 이후 안 돌아 오류 제목·빈 사진이 앱에 그대로 남은 원인이 이것이다.
    #    → 무거운 둘을 떼어 **그룹별로 동시에** 돌린다. 총 작업량은 같고 벽시계만 준다
    #      (문토 34분 + 프립 10분 + 나머지 15곳 ≈ 15분 → 셋 동시 = 약 34분).
    #    새 스크래퍼는 crawler/main.py 의 GROUPS 에 안 적으면 자동으로 rest 로 간다.
    #
    # ⚠️(2026-09-04, 나눈 직후 실측) 나누고 나서도 문토 그룹만 또 45분에 잘렸다.
    #    실측 — 프립 10분 / 나머지 15곳 23분 / 문토는 수집만 32분(모임 1,596건, 카테고리
    #    12개를 상세 API로 하나씩 조회) + 저장·썸네일 재호스팅이 12분 넘게 더 걸려 초과.
    #    이 저장소는 public 이라 Actions 실행 시간이 무료·무제한이다. 그래서 문토만
    #    한도를 크게 준다(그룹별 한도 = matrix.timeout). 문토가 더 느려지면 이제
    #    watchdog 의 check_silent_crawls 가 30시간 무기록으로 잡아 알린다.
    strategy:
      fail-fast: false      # 한 그룹이 죽어도 나머지 그룹은 끝까지 돈다
      matrix:
        include:
          - group: munto
            timeout: 120
          - group: frip
            timeout: 45
          - group: rest
            timeout: 45
    timeout-minutes: ${{ matrix.timeout }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('crawler/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('crawler/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          cd crawler
          pip install -r requirements.txt
          playwright install chromium --with-deps
          # 파이낸스라운지(노션 페이지)는 번들 Chromium을 "호환 안 되는 브라우저"로 막아
          # 실제 Chrome(channel='chrome')이 필요하다 — scrapers/finance_lounge.py 참고.
          playwright install chrome --with-deps

      - name: Run crawlers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODPARTY_ID: ${{ secrets.MODPARTY_ID }}
          MODPARTY_PW: ${{ secrets.MODPARTY_PW }}
          # 연숲은 인스타에만 공지한다. 인스타 무로그인 API가 막혀 유료 대행(Apify)으로 받는다
          # — scrapers/yeonsoop.py 참고. 없으면 그 업체만 실패하고 나머지 크롤은 계속 돈다.
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # ⚠️ 이게 없으면 utils/thumbnail.py 가 **조용히 통과**한다(R2_ENDPOINT 미설정 시 return).
          #    그래서 8/19에 만든 썸네일 최적화(900px WebP 재호스팅)가 프로덕션 크롤에서
          #    한 번도 안 돌았고, 소개팅 첫 화면이 5.79MB 였다(2026-09-02 실측).
          #    imweb(에모셔널오렌지·시크릿살롱)이 한 장에 0.8~1.4MB 를 그대로 내려주고 있었다.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          cd crawler
          python main.py --group=${{ matrix.group }}

      # 그룹이 시간 초과로 잘리면 GH 는 '취소'로 남긴다. failure() 는 취소를 안 잡아
      # 알림이 한 번도 안 나갔다(2026-09-04). cancelled() 를 같이 본다.
      - name: Notify on failure
        if: failure() || cancelled()
        run: |
          echo "::error::크롤 그룹 '${{ matrix.group }}' 실패/시간초과 — Supabase crawl_logs 및 Actions 로그 확인"

  # 크롤 3그룹이 모두 끝난 뒤 한 번만 도는 뒷정리(검증·푸시 발송·마감알림).
  post:
    needs: crawl
    if: always()          # 한 그룹이 잘려도 나머지 결과에 대한 알림은 나가야 한다
    runs-on: ubuntu-22.04
    # 실측 20분(설치 4분 + QA·가격점검 + 푸시 큐 소진)으로 한도에 딱 붙었다 → 여유를 준다.
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('crawler/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('crawler/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          cd crawler
          pip install -r requirements.txt
          # 가격 정확도 점검이 실제 업체 페이지를 다시 열어 대조한다 — 브라우저 필요.
          playwright install chromium --with-deps

      - name: QA — 크롤링 결과 검증
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd crawler
          python qa_validator.py
        continue-on-error: true   # WARN만 있을 때 전체 워크플로우 중단 방지

      - name: QA — 가격 정확도 점검 (price_detail 유령필드 재발 방지)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODPARTY_ID: ${{ secrets.MODPARTY_ID }}
          MODPARTY_PW: ${{ secrets.MODPARTY_PW }}
        run: |
          cd crawler
          python price_accuracy_check.py
        continue-on-error: true   # 불일치 있어도 크롤 자체는 막지 않음, Actions 로그에 가시화만
        timeout-minutes: 8        # 스크래퍼 하나가 멈춰도 이 step만 취소되고 나머지 워크플로우는 계속

      - name: Process push queue (send notifications)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # process-push-queue 3회 호출 (큐 완전 소진)
          for i in 1 2 3; do
            curl -sf -X POST \
              "$SUPABASE_URL/functions/v1/process-push-queue" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" || true
            sleep 2
          done

      - name: Check deadline reminders
        # ⚠️(2026-07-25) 예전엔 workflow_dispatch면 무조건 실행이라, 워치독이 타임아웃 재시도로
        # 반복 재발화할 때마다 같은 D-1 마감알림이 오너 폰에 중복 발송될 뻔했음(실제 재발화
        # 여러 번 겹친 걸 오늘 확인). CF Worker의 20시 슬롯 트리거만 slot=evening을 넘기고,
        # 워치독의 임시 재시도는 입력 없이 부르므로 이 스텝을 자동 스킵.
        if: contains(github.event.schedule, '0 11') || github.event.inputs.slot == 'evening'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUSH_WEBHOOK_SECRET: ${{ secrets.PUSH_WEBHOOK_SECRET }}
        run: |
          python3 -c "
          import os, httpx, json
          from datetime import datetime, timedelta, timezone

          url = os.environ['SUPABASE_URL']
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          headers = {'apikey': key, 'Authorization': f'Bearer {key}', 'Content-Type': 'application/json'}

          # D-1 이벤트 조회 (KST 기준 내일)
          KST = timezone(timedelta(hours=9))
          tomorrow_kst = (datetime.now(KST) + timedelta(days=1)).strftime('%Y-%m-%d')
          resp = httpx.get(
              f'{url}/rest/v1/events',
              params=[
                  ('select', 'id,title,event_date,location_region,company_id,source_url'),
                  ('event_date', f'gte.{tomorrow_kst}T00:00:00+09:00'),
                  ('event_date', f'lt.{tomorrow_kst}T23:59:59+09:00'),
                  ('is_active', 'eq.true'),
                  ('is_closed', 'eq.false'),
              ],
              headers=headers, timeout=15
          )
          events = resp.json() if resp.status_code == 200 else []
          print(f'D-1 이벤트: {len(events)}개')

          for event in events:
              edge_resp = httpx.post(
                  f'{url}/functions/v1/match-subscriptions',
                  json={'record': {**event, '_notification_type': 'deadline_reminder'}},
                  headers={
                      'Authorization': f'Bearer {key}',
                      'Content-Type': 'application/json',
                      # 앱 공개키만으로 가짜 푸시를 큐잉시킬 수 있던 문제(2026-07-28) 대응 —
                      # 내부 호출자만 아는 시크릿을 함께 보낸다.
                      'x-webhook-secret': os.environ.get('PUSH_WEBHOOK_SECRET', ''),
                  },
                  timeout=15
              )
              print(f'마감 알림 큐: {edge_resp.status_code}')
          "

      - name: Process push queue again (deadline reminders just queued above)
        # ⚠️(2026-08-03) 마감알림(D-1)은 바로 위 단계에서 막 큐에 들어가는데, 큐 소진은
        # 그보다 앞선 단계에서 한 번뿐이라 이 실행분은 다음날 아침 실행 때까지 묵혀 있었다.
        # 그 사이 사용자가 알림을 끄면 이미 꺼둔 사람에게도 나가는 사고로 이어졌다(발송
        # 시점에 다시 걸러주는 process-push-queue 자체 수정과는 별개로, 큐에 오래 쌓여
        # 있을수록 그럴 일이 늘어나므로 최대한 빨리 비워야 한다). crawler 단계의 비동기
        # pg_net 웹훅이 살짝 늦게 들어와 앞선 소진에서 놓친 new_event 메시지도 여기서 마저 비운다.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for i in 1 2 3; do
            curl -sf -X POST \
              "$SUPABASE_URL/functions/v1/process-push-queue" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" || true
            sleep 2
          done

      # 크롤 그룹 중 하나라도 실패·시간초과면 여기서도 표시한다(post 는 always() 라
      # 그냥 두면 초록으로 끝나 사고가 안 보인다 — 2026-09-04 무증상 200회 재발 방지).
      - name: Notify on failure
        if: failure() || cancelled() || needs.crawl.result != 'success'
        run: |
          echo "::error::크롤링 실패 — 크롤 결과: ${{ needs.crawl.result }}. Supabase crawl_logs 및 GitHub Actions 로그를 확인하세요."
          exit 1
