name: Refresh Nonimweb (프립·문토·토크블라썸·괜찮소·시크릿살롱·모드파티·트레바리·동행클럽 마감)

# 2026-07-29 분리 신설. 이 업체들은 imweb 예약위젯이 없어 스크래퍼를 통째로 재사용하는데,
# all-or-nothing이라 days 필터가 안 먹고 매번 전체를 돈다. 프립이 418건까지 커지면서
# 이 작업만으로 실행이 길어졌고, 같은 워크플로에 묶여 있던 imweb 15분 갱신까지 밀렸다.
# 별도 concurrency group으로 떼어내 서로 큐를 막지 않게 한다.
#
# 2026-09-04: 소셜링 전용 업체(트레바리·동행클럽)가 이 마감임박 경량 갱신에서 빠져 있어
# 하루 2번(정기크롤)에만 갱신되던 걸 오너 지적으로 여기 추가(crawler/refresh_soldout.py
# 의 _nonimweb_scrapers()). 실측 18초·6초라 15분 주기에 실행시간 부담 없음.
on:
  schedule:
    # 임박(2일내): 15분마다 — 프립·문토는 경량 경로(상품/일정별 조회)로 40초면 끝난다.
    #   나머지 업체(토크블라썸·괜찮소·시크릿살롱·모드파티)는 원래도 합쳐서 2분대라 같이 돈다.
    - cron: '2,17,32,47 * * * *'
    # 전체 미래: 1시간마다 — 경량 경로가 못 다루는 것(프립 다지점 등)까지 훑는다.
    - cron: '43 * * * *'
  # ⚠️ 새로 추가한 워크플로는 GH가 크론을 곧바로 등록하지 않는 경우가 있다(2026-07-29
  #    실제 발생: 추가 후 스케줄이 한 번도 안 돌아 워치독이 82분 갭을 잡아 알렸다).
  #    워치독의 자가복구 재발화가 이 공백을 메운다.
  workflow_dispatch:
    inputs:
      days:
        description: '앞으로 N일 내 일정만(비우면 전체)'
        required: false

concurrency:
  group: refresh-nonimweb
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('crawler/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('crawler/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          cd crawler
          pip install -r requirements.txt
          # ⚠️ 2026-09-10. 구글 크롬 apt 저장소가 깨진 파일 목록을 돌려주면
          #    (dl.google.com ... Hash Sum mismatch) --with-deps 안의 apt-get update 가
          #    통째로 실패해 «준비 단계»에서 크롤이 죽는다. 실제로 세 워크플로가 동시에
          #    죽었다. 크로미움은 구글 저장소가 필요 없으므로 그 목록만 치우고 설치한다.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          playwright install chromium --with-deps

      - name: Refresh nonimweb soldout
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 모드파티는 로그인해야 마감을 볼 수 있다. 이 둘이 없어서 매 실행마다
          # "환경변수 없음 — 스킵"으로 건너뛰었고, 마감 정보가 하루 2회 기본 크롤에만
          # 반영돼 최대 12시간 낡은 채로 나갔다(2026-07-31 발견).
          MODPARTY_ID: ${{ secrets.MODPARTY_ID }}
          MODPARTY_PW: ${{ secrets.MODPARTY_PW }}
        run: |
          cd crawler
          # 15분 크론=임박 2일내(경량), 그 외(1시간·수동)=전체 미래
          if [ "${{ github.event.schedule }}" = "2,17,32,47 * * * *" ]; then
            python refresh_soldout.py --part nonimweb --days 2
          elif [ -n "${{ github.event.inputs.days }}" ]; then
            python refresh_soldout.py --part nonimweb --days "${{ github.event.inputs.days }}"
          else
            python refresh_soldout.py --part nonimweb
          fi
