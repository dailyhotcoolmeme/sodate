name: Refresh Soldout imweb (경량 매진·가격)

# ⚠️(2026-07-25) 스케줄 트리거가 GH 쪽에서 약 2시간 넘게 발화를 안 한 사고 있었음
# (workflow_dispatch는 정상 동작 — YAML/코드 문제 아니고 GH 스케줄러 쪽 이슈로 추정).
# 이 주석으로 워크플로 파일을 건드려 스케줄 재등록 유도.
# 전체 크롤과 별개로, imweb 예약위젯에서 성별 매진·가격만 자주 갱신(발굴·블로그 없이 가벼움).
# 퍼블릭 레포 = Actions 무료 무제한 → 짧은 간격 가능.
#   - 임박(2일내) 이벤트: 10분마다 (near-realtime)
#   - 전체 미래 이벤트(imweb) + 비-imweb(프립·토크블라썸·괜찮소 스크래퍼 재사용): 1시간마다
# ⚠️(2026-07-29) 이 워크플로는 imweb 위젯 갱신만 담당한다. 예전엔 비-imweb 업체
#    (프립·토크블라썸·괜찮소) 전체 크롤까지 같이 돌았는데, 그쪽은 days 필터가 안 먹어
#    매번 전체를 돌고 프립이 418건까지 커지면서 실행 시간을 지배했다. 같은 큐를 쓰다
#    보니 imweb 경량 갱신까지 밀려 15분 주기를 못 지켰다 → refresh-nonimweb.yml로 분리.
on:
  schedule:
    # 10분마다 → 임박(2일내) imweb. 작업 자체는 1분이고 러너 준비까지 4~6분이라
    # 10분 주기가 실질적 하한이다(5분으로 하면 쉬지 않고 도는 셈, 큐가 밀린다).
    - cron: '*/10 * * * *'
    - cron: '7 * * * *'      # 1시간마다 → 전체 미래 imweb
  workflow_dispatch:
    inputs:
      days:
        description: '앞으로 N일 내 이벤트만(비우면 전체)'
        required: false
        default: ''

# 실행 겹침 방지(이전 실행 취소)
concurrency:
  group: refresh-soldout
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('crawler/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('crawler/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          cd crawler
          pip install -r requirements.txt
          # ⚠️ 2026-09-10. 구글 크롬 apt 저장소가 깨진 파일 목록을 돌려주면
          #    (dl.google.com ... Hash Sum mismatch) --with-deps 안의 apt-get update 가
          #    통째로 실패해 «준비 단계»에서 크롤이 죽는다. 실제로 세 워크플로가 동시에
          #    죽었다. 크로미움은 구글 저장소가 필요 없으므로 그 목록만 치우고 설치한다.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          playwright install chromium --with-deps

      - name: Refresh soldout/price
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd crawler
          # 10분 크론(*/10)=임박 2일내, 그 외(1시간·수동)=전체
          if [ "${{ github.event.schedule }}" = "*/10 * * * *" ]; then
            python refresh_soldout.py --part imweb --days 2
          elif [ -n "${{ github.event.inputs.days }}" ]; then
            python refresh_soldout.py --part imweb --days "${{ github.event.inputs.days }}"
          else
            python refresh_soldout.py --part imweb
          fi
