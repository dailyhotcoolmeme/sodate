name: Refresh Soldout (경량 매진·가격)

# ⚠️(2026-07-25) 스케줄 트리거가 GH 쪽에서 약 2시간 넘게 발화를 안 한 사고 있었음
# (workflow_dispatch는 정상 동작 — YAML/코드 문제 아니고 GH 스케줄러 쪽 이슈로 추정).
# 이 주석으로 워크플로 파일을 건드려 스케줄 재등록 유도.
# 전체 크롤과 별개로, imweb 예약위젯에서 성별 매진·가격만 자주 갱신(발굴·블로그 없이 가벼움).
# 퍼블릭 레포 = Actions 무료 무제한 → 짧은 간격 가능.
#   - 임박(2일내) 이벤트: 15분마다 (near-realtime)
#   - 전체 미래 이벤트(imweb) + 비-imweb(프립·토크블라썸·괜찮소 스크래퍼 재사용): 1시간마다
# ⚠️(2026-07-29) 15분 주기였는데 실제 실행이 18~29분 걸려 매번 겹쳤다. GH는 동시성
#    대기를 1개만 허용해 나머지를 취소하므로 성공 간격이 45분을 넘었고, 그걸 워치독이
#    '스케줄 멈춤'으로 보고 재발화 → 큐가 더 밀리는 악순환이었다. 주기를 실제 소요
#    시간에 맞춰 30분으로 늘린다(임박 갱신은 30분이면 충분).
on:
  schedule:
    - cron: '*/30 * * * *'   # 30분마다 → 임박(2일내)
    - cron: '7 * * * *'      # 1시간마다 → 전체(imweb+비imweb)
  workflow_dispatch:
    inputs:
      days:
        description: '앞으로 N일 내 이벤트만(비우면 전체)'
        required: false
        default: ''

# 실행 겹침 방지(이전 실행 취소)
concurrency:
  group: refresh-soldout
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('crawler/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('crawler/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          cd crawler
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Refresh soldout/price
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd crawler
          # 15분 크론(*/15)=임박 2일내, 그 외(2시간·수동)=전체
          if [ "${{ github.event.schedule }}" = "*/30 * * * *" ]; then
            python refresh_soldout.py --days 2
          elif [ -n "${{ github.event.inputs.days }}" ]; then
            python refresh_soldout.py --days "${{ github.event.inputs.days }}"
          else
            python refresh_soldout.py
          fi
