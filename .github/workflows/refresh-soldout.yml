name: Refresh Soldout (경량 매진·가격)

# 전체 크롤과 별개로, imweb 예약위젯에서 성별 매진·가격만 자주 갱신(발굴·블로그 없이 가벼움).
# 퍼블릭 레포 = Actions 무료 무제한 → 짧은 간격 가능.
#   - 임박(2일내) 이벤트: 15분마다 (near-realtime)
#   - 전체 미래 이벤트: 2시간마다
on:
  schedule:
    - cron: '*/15 * * * *'   # 15분마다 → 임박(2일내)
    - cron: '7 */2 * * *'    # 2시간마다 → 전체 미래
  workflow_dispatch:
    inputs:
      days:
        description: '앞으로 N일 내 이벤트만(비우면 전체)'
        required: false
        default: ''

# 실행 겹침 방지(이전 실행 취소)
concurrency:
  group: refresh-soldout
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('crawler/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('crawler/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          cd crawler
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Refresh soldout/price
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd crawler
          # 15분 크론(*/15)=임박 2일내, 그 외(2시간·수동)=전체
          if [ "${{ github.event.schedule }}" = "*/15 * * * *" ]; then
            python refresh_soldout.py --days 2
          elif [ -n "${{ github.event.inputs.days }}" ]; then
            python refresh_soldout.py --days "${{ github.event.inputs.days }}"
          else
            python refresh_soldout.py
          fi
