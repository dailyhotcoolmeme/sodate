name: Legacy Local Community Drafts

on:
  workflow_dispatch:
    inputs:
      target:
        description: '비상용 로컬 초안 목표 수'
        required: false
        default: '90'

concurrency:
  group: auto-board-posts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Fill admin draft queue without AI
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd crawler
          python auto_board_posts.py --generator local --fill-to "${{ github.event.inputs.target || '90' }}"
